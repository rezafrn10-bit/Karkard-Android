name: Build Signed VaghtNegar Hoor APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Karkard_Android_Project.zip
          unzip -tq Karkard_Android_Project.zip
          mkdir -p project
          unzip -q Karkard_Android_Project.zip -d project
          test -f project/app/build.gradle.kts

      - name: Restore private signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.VAGHTNEGAR_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.VAGHTNEGAR_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.VAGHTNEGAR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VAGHTNEGAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEY_B64 STORE_PASS KEY_PASS KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing signing secret corresponding to $name" >&2
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/vaghtnegar-release.p12"
          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing key restored and alias verified."

      - name: Assemble signed release APK
        shell: bash
        env:
          VAGHTNEGAR_KEYSTORE_PATH: ${{ runner.temp }}/vaghtnegar-release.p12
          VAGHTNEGAR_STORE_PASSWORD: ${{ secrets.VAGHTNEGAR_STORE_PASSWORD }}
          VAGHTNEGAR_KEY_ALIAS: ${{ secrets.VAGHTNEGAR_KEY_ALIAS }}
          VAGHTNEGAR_KEY_PASSWORD: ${{ secrets.VAGHTNEGAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd project
          gradle assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          # apksigner returns a nonzero exit status if verification actually fails.
          # Do not grep its human-readable output: formatting varies by build-tools version.
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "APK signature verification passed."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: VaghtNegarHoor-SIGNED-APK
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
