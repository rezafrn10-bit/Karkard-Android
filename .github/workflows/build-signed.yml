name: Build Signed VaghtNegar Hoor APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Validate and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Karkard_Android_Project.zip
          unzip -tq Karkard_Android_Project.zip
          mkdir -p project
          unzip -q Karkard_Android_Project.zip -d project

          # The ZIP may contain the project at its root or inside a versioned
          # wrapper directory (for example, v052work/). Find the actual Gradle root.
          mapfile -t gradle_files < <(find project -type f -path '*/app/build.gradle.kts' -print)
          if [[ "${#gradle_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one app/build.gradle.kts in the archive; found ${#gradle_files[@]}." >&2
            find project -maxdepth 5 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print >&2
            exit 1
          fi

          app_gradle="${gradle_files[0]}"
          project_root="${app_gradle%/app/build.gradle.kts}"
          if [[ ! -f "$project_root/settings.gradle" && ! -f "$project_root/settings.gradle.kts" ]]; then
            echo "Found app/build.gradle.kts but no settings.gradle(.kts) beside it: $project_root" >&2
            exit 1
          fi

          echo "Detected Gradle project root: $project_root"
          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"

      - name: Restore private signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.VAGHTNEGAR_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.VAGHTNEGAR_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.VAGHTNEGAR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VAGHTNEGAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEY_B64 STORE_PASS KEY_PASS KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing signing secret corresponding to $name" >&2
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/vaghtnegar-release.p12"
          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing key restored and alias verified."

      - name: Assemble signed release APK
        shell: bash
        env:
          VAGHTNEGAR_KEYSTORE_PATH: ${{ runner.temp }}/vaghtnegar-release.p12
          VAGHTNEGAR_STORE_PASSWORD: ${{ secrets.VAGHTNEGAR_STORE_PASSWORD }}
          VAGHTNEGAR_KEY_ALIAS: ${{ secrets.VAGHTNEGAR_KEY_ALIAS }}
          VAGHTNEGAR_KEY_PASSWORD: ${{ secrets.VAGHTNEGAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_ROOT"
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "APK signature verification passed."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: VaghtNegarHoor-SIGNED-APK
          path: project/**/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
