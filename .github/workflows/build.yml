
name: Build Karkard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Karkard_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip Karkard_Android_Project.zip -d project

     
      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          for path in root.rglob("*"):
              if path.is_file() and path.name in ("build.gradle.kts", "build.gradle"):
                  text = path.read_text()
                  text = text.replace("VERSION_1_8", "VERSION_17")
                  text = text.replace('"1.8"', '"17"')
                  text = text.replace("'1.8'", "'17'")
                  path.write_text(text)
                  print(f"Checked: {path}")
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Karkard-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
