
name: Build Karkard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Karkard_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip Karkard_Android_Project.zip -d project

      - name: Set Java and Kotlin JVM target to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          marker = "android {"
          additions = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if marker not in s:
                  raise SystemExit("Could not find android block")
              s = s.replace(marker, additions, 1)
              p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Karkard-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
