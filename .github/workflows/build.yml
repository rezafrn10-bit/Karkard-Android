name: Build and test VaghtNegar

on:
  workflow_dispatch:
  push:
    paths:
      - 'Karkard_Android_Project_v0731.zip'
      - '.github/workflows/build.yml'
      - '.github/overlays/daily-ui-flow.patch'
      - '.github/overlays/v074-core.patch'
      - '.github/scripts/run-android-instrumentation.sh'
  pull_request:
    paths:
      - 'Karkard_Android_Project_v0731.zip'
      - '.github/workflows/build.yml'
      - '.github/overlays/daily-ui-flow.patch'
      - '.github/overlays/v074-core.patch'

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools'

      - name: Install compileSdk 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Validate archive and locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -f Karkard_Android_Project_v0731.zip
          unzip -tq Karkard_Android_Project_v0731.zip
          mkdir -p project
          unzip -q Karkard_Android_Project_v0731.zip -d project
          mapfile -t app_gradle_files < <(find project -type f -path '*/app/build.gradle.kts' -print)
          if [[ "${#app_gradle_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one app/build.gradle.kts; found ${#app_gradle_files[@]}." >&2
            find project -maxdepth 7 -type f -name 'settings.gradle*' -print >&2
            exit 1
          fi
          project_root="${app_gradle_files[0]%/app/build.gradle.kts}"
          if [[ ! -f "$project_root/settings.gradle.kts" && ! -f "$project_root/settings.gradle" ]]; then
            echo "Gradle settings file not found beside $project_root/app." >&2
            exit 1
          fi
          echo "Detected Gradle project root: $project_root"
          command -v patch
          echo "Applying v0.74 core patch."
          (cd project && patch --dry-run --batch --forward -p1 -i "$GITHUB_WORKSPACE/.github/overlays/v074-core.patch")
          (cd project && patch --batch --forward -p1 -i "$GITHUB_WORKSPACE/.github/overlays/v074-core.patch")
          grep -q 'versionCode = 76' "$project_root/app/build.gradle.kts"
          grep -q 'versionName = "0.74.0"' "$project_root/app/build.gradle.kts"
          echo "Applying UI regression and calendar-policy overlay."
          (cd project && patch --dry-run --batch --forward -p1 -i "$GITHUB_WORKSPACE/.github/overlays/daily-ui-flow.patch")
          (cd project && patch --batch --forward -p1 -i "$GITHUB_WORKSPACE/.github/overlays/daily-ui-flow.patch")
          test_file="$(find project -type f -name 'DailyUiFlowInstrumentedTest.kt' -print -quit)"
          expected_test_file="$project_root/app/src/androidTest/java/ir/karkard/app/DailyUiFlowInstrumentedTest.kt"
          if [[ -z "$test_file" ]]; then
            echo "UI instrumentation source was not created by the overlay." >&2
            find project -type f -path '*/app/src/androidTest/*' -print >&2
            exit 1
          fi
          if [[ "$test_file" != "$expected_test_file" ]]; then
            echo "UI instrumentation source was created at unexpected path: $test_file" >&2
            echo "Expected: $expected_test_file" >&2
            exit 1
          fi
          grep -nE 'fun (dailyEditorSavePersistsTimesAndReloadsThemAfterLeavingTheScreen|monthlyReportCanManuallyReachTheCurrentDayCard)' "$project_root/app/src/androidTest/java/ir/karkard/app/DailyUiFlowInstrumentedTest.kt"
          echo "project_root=$project_root" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build debug APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_ROOT"
          gradle --version
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK and unit-test reports
        uses: actions/upload-artifact@v7
        with:
          name: VaghtNegar-v074-debug
          path: |
            project/**/build/outputs/apk/debug/*.apk
            project/**/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 30

  android-device-tests:
    name: Android API ${{ matrix.api-level }} instrumentation tests
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [34]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and emulator tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools emulator'

      - name: Install compileSdk 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Reclaim runner disk space for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/sources"
          echo "Disk space after cleanup:"
          df -h /

      - name: Enable and verify KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm; refusing to launch a software-emulated Android device."
            exit 1
          fi
          sudo groupadd --force kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          echo "KVM device permissions:"
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Extract and locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq Karkard_Android_Project_v0731.zip
          mkdir -p project
          unzip -q Karkard_Android_Project_v0731.zip -d project
          mapfile -t app_gradle_files < <(find project -type f -path '*/app/build.gradle.kts' -print)
          if [[ "${#app_gradle_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one app/build.gradle.kts; found ${#app_gradle_files[@]}." >&2
            find project -maxdepth 7 -type f -name 'settings.gradle*' -print >&2
            exit 1
          fi
          project_root="${app_gradle_files[0]%/app/build.gradle.kts}"
          test -f "$project_root/settings.gradle.kts" -o -f "$project_root/settings.gradle"
          echo "Detected Gradle project root: $project_root"
          echo "Applying UI-test overlay from the Gradle project root (strip two path components)."
          command -v patch
          (cd project && patch --dry-run --batch --forward -p1 -i "$GITHUB_WORKSPACE/.github/overlays/daily-ui-flow.patch")
          (cd project && patch --batch --forward -p1 -i "$GITHUB_WORKSPACE/.github/overlays/daily-ui-flow.patch")
          test_file="$(find project -type f -name 'DailyUiFlowInstrumentedTest.kt' -print -quit)"
          expected_test_file="$project_root/app/src/androidTest/java/ir/karkard/app/DailyUiFlowInstrumentedTest.kt"
          if [[ -z "$test_file" ]]; then
            echo "UI instrumentation source was not created by the overlay." >&2
            find project -type f -path '*/app/src/androidTest/*' -print >&2
            exit 1
          fi
          if [[ "$test_file" != "$expected_test_file" ]]; then
            echo "UI instrumentation source was created at unexpected path: $test_file" >&2
            echo "Expected: $expected_test_file" >&2
            exit 1
          fi
          grep -nE 'fun (dailyEditorSavePersistsTimesAndReloadsThemAfterLeavingTheScreen|monthlyReportCanManuallyReachTheCurrentDayCard)' "$project_root/app/src/androidTest/java/ir/karkard/app/DailyUiFlowInstrumentedTest.kt"
          echo "project_root=$project_root" >> "$GITHUB_OUTPUT"
      - name: Run instrumentation tests on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          # Give the API 34 system image more headroom; keep Gradle worker count bounded in the test script.
          ram-size: 3072M
          heap-size: 768M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          # KVM access is validated above; do not silently fall back to slow software CPU emulation.
          disable-linux-hw-accel: false
          working-directory: ${{ github.workspace }}/${{ steps.project.outputs.project_root }}
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-android-instrumentation.sh"

      - name: Upload instrumentation-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: |
            project/**/build/reports/androidTests/**
            instrumentation-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
