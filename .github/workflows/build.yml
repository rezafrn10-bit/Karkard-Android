
name: Build Karkard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Karkard_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project archive
        run: |
          test -f Karkard_Android_Project.zip
          unzip -t Karkard_Android_Project.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q Karkard_Android_Project.zip -d project
          find project -name gradlew -type f

      - name: Build debug APK
        run: |
          if [ -f project/gradlew ]; then
            cd project
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found in project root."
            echo "Please check the ZIP folder structure."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karkard-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
